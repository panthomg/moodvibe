<!DOCTYPE html>

<head>

    <title>MoodVibe - Peaceful Mood Tracker</title>
    <!-- React, ReactDOM, Babel (for in-browser JSX) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Chart.js CDN -->

    <!-- jsPDF and html2canvas for PDF Export -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- External CSS -->

    <meta property="og:type" content="website">
    <meta property="og:title" content="MoodVibe – Mood Tracker">
    <meta property="og:description" content="Log and track your moods with, visualize trends, and enjoy a private, on-device experience. Try MoodVibe for free!">
    <meta property="og:image" content="https://moodvibee.netlify.app/mvlogo.png">
    <meta property="og:url" content="https://moodvibee.netlify.app/">
    <meta property="og:site_name" content="MoodVibe">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="MoodVibe – Track Moods with Custom Icons">
    <meta name="twitter:description" content="Discover MoodVibe, a privacy-first mood tracker with custom PNG icons and insightful visualizations. Free and web-based.">

    <meta name="twitter:site" content="@MoodVibeApp">
    <!-- Favicon -->
    <link rel="icon" href="mvlogo.webp" type="image/webp">

</head>
<body>
    <div id="root">

    <!-- External JavaScript -->
    <script type="text/babel" data-presets="react,env" src="script.js"></script>
    <script>
        if (window.App) {
            ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(window.App));
        }
    </script>
